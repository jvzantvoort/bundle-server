name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test Go module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.5'
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/bundle-server
