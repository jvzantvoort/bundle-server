version: 2

project_name: bundle-server

builds:
  - id: bundle-server
    main: ./cmd/bundle-server
    binary: bundle-server
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
